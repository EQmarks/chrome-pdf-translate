<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>框选译</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">框选译</div>
    <div class="page" id="pageKind">检测中…</div>
  </header>

  <div class="card" id="last"></div>

  <label class="row"><span>划词翻译</span><input type="checkbox" id="enabled"></label>
  <label class="row" title="关掉后只有内置 PDF 阅读器会框选翻译，网页上不自动弹卡"><span>网页上也自动翻译</span><input type="checkbox" id="webEnabled"></label>
  <label class="row"><span>触发方式</span>
    <select id="mode">
      <option value="auto">选中即译</option>
      <option value="ctrl">按住 Ctrl 才译</option>
      <option value="off">关闭</option>
    </select>
  </label>
  <label class="row"><span>引擎</span><select id="engine"></select></label>
  <label class="row"><span>译为</span><select id="target"></select></label>
  <label class="row"><span>复制即翻译（PDF）</span><input type="checkbox" id="watch"></label>

  <div class="tip" id="tip"></div>

  <div class="acts">
    <button id="reader">打开 PDF 阅读器</button>
    <button id="panel" class="primary">打开侧栏</button>
  </div>
  <div class="acts">
    <button id="opts">设置</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
